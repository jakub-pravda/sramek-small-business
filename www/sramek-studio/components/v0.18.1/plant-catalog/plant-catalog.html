<link rel="stylesheet" href="./plant-catalog.css">

<section class="ss-plant-catalog" data-ss-plant-catalog aria-labelledby="plant-catalog-title">
  <img class="ss-plant-catalog__motif" data-plant-motif src="/images/graphic-elements/structure.svg" alt="" aria-hidden="true">
  <header class="ss-plant-catalog__heading">
    <p class="ss-plant-catalog__eyebrow">Sortiment dřevin</p>
    <h2 id="plant-catalog-title">Dřeviny pro stinná až polostinná stanoviště</h2>
  </header>

  <div class="ss-plant-carousel-shell">
  <div class="ss-plant-carousel" data-plant-carousel aria-label="Posuvný sortiment dřevin">
    <div class="ss-plant-carousel__track" data-plant-track>
    <!-- Položku lze kopírovat; datové atributy naplňují společný detail. -->
    <button class="ss-plant-card" type="button" data-plant aria-expanded="false"
      data-name="Tis červený" data-latin="Taxus baccata"
      data-description="Stálezelená dřevina s jemnou strukturou, vhodná pro živé ploty, tvarování i klidné solitérní výsadby."
      data-light="Stín až polostín" data-height="2–5 m" data-care="Nízká"
      data-image="/images/flowers/tis-cerveny.webp" data-alt="Tis červený (Taxus baccata)">
      <span class="ss-plant-card__image"><img src="/images/flowers/tis-cerveny.webp" alt=""></span>
      <span class="ss-plant-card__copy"><b>1. tis červený</b><i>Taxus baccata</i></span>
    </button>
    <button class="ss-plant-card" type="button" data-plant aria-expanded="false"
      data-name="Zimostráz vždyzelený" data-latin="Buxus sempervirens" data-description="Kompaktní stálezelený keř pro nízké živé ploty, lemy a pravidelně tvarované prvky zahrady." data-light="Polostín" data-height="0,5–2 m" data-care="Střední" data-image="/images/flowers/zimostraz-vzdyzeleny.webp" data-alt="Zimostráz vždyzelený (Buxus sempervirens)">
      <span class="ss-plant-card__image"><img src="/images/flowers/zimostraz-vzdyzeleny.webp" alt=""></span><span class="ss-plant-card__copy"><b>2. zimostráz vždyzelený</b><i>Buxus sempervirens</i></span>
    </button>
    <button class="ss-plant-card" type="button" data-plant aria-expanded="false"
      data-name="Mahónie cesmínolistá" data-latin="Mahonia aquifolium" data-description="Odolný stálezelený keř s výraznými listy, žlutými květy a modrými plody pro podrostové výsadby." data-light="Stín až polostín" data-height="1–1,5 m" data-care="Nízká" data-image="/images/flowers/mahonie-cesminolista.webp" data-alt="Mahónie cesmínolistá (Mahonia aquifolium)">
      <span class="ss-plant-card__image"><img src="/images/flowers/mahonie-cesminolista.webp" alt=""></span><span class="ss-plant-card__copy"><b>3. mahónie cesmínolistá</b><i>Mahonia aquifolium</i></span>
    </button>
    <button class="ss-plant-card is-active" type="button" data-plant aria-expanded="true"
      data-name="Cesmína ostrolistá" data-latin="Ilex aquifolium" data-description="Stálezelená dřevina s lesklými tmavě zelenými listy a výraznými červenými plody. V zahradě vytváří celoroční strukturu, soukromí a atraktivní zimní efekt." data-light="Polostín až slunce" data-height="2–6 m" data-care="Nízká" data-image="/images/flowers/cesmina-ostrolista.webp" data-alt="Cesmína ostrolistá (Ilex aquifolium)">
      <span class="ss-plant-card__image"><img src="/images/flowers/cesmina-ostrolista.webp" alt=""></span><span class="ss-plant-card__copy"><b>4. cesmína ostrolistá</b><i>Ilex aquifolium</i></span>
    </button>
    <button class="ss-plant-card" type="button" data-plant aria-expanded="false"
      data-name="Brslen Fortuneův" data-latin="Euonymus fortunei" data-description="Přizpůsobivý stálezelený keř vhodný jako půdopokryvná rostlina, nízký lem nebo popínavý akcent." data-light="Stín až slunce" data-height="0,3–1 m" data-care="Nízká" data-image="/images/flowers/brslen-fortuneuv.webp" data-alt="Brslen Fortuneův (Euonymus fortunei)">
      <span class="ss-plant-card__image"><img src="/images/flowers/brslen-fortuneuv.webp" alt=""></span><span class="ss-plant-card__copy"><b>5. brslen Fortuneův</b><i>Euonymus fortunei</i></span>
    </button>
    <button class="ss-plant-card" type="button" data-plant aria-expanded="false"
      data-name="Kalina obecná" data-latin="Viburnum opulus" data-description="Domácí opadavý keř s bílými květy a červenými plody, vhodný do přírodních a krajinářských výsadeb." data-light="Polostín až slunce" data-height="2–4 m" data-care="Nízká" data-image="/images/flowers/kalina-obecna.webp" data-alt="Kalina obecná (Viburnum opulus)">
      <span class="ss-plant-card__image"><img loading="lazy" src="/images/flowers/kalina-obecna.webp" alt=""></span><span class="ss-plant-card__copy"><b>6. kalina obecná</b><i>Viburnum opulus</i></span>
    </button>
    <button class="ss-plant-card" type="button" data-plant aria-expanded="false"
      data-name="Kalina vrásčitolistá" data-latin="Viburnum rhytidophyllum" data-description="Robustní stálezelený keř s výraznou texturou listů, vhodný pro clony a objemné skupinové výsadby." data-light="Stín až polostín" data-height="2–4 m" data-care="Nízká" data-image="/images/flowers/kalina-vrascolista.webp" data-alt="Kalina vrásčitolistá (Viburnum rhytidophyllum)">
      <span class="ss-plant-card__image"><img loading="lazy" src="/images/flowers/kalina-vrascolista.webp" alt=""></span><span class="ss-plant-card__copy"><b>7. kalina vrásčitolistá</b><i>Viburnum rhytidophyllum</i></span>
    </button>
    <button class="ss-plant-card" type="button" data-plant aria-expanded="false"
      data-name="Hortenzie latnatá" data-latin="Hydrangea paniculata" data-description="Dlouho kvetoucí keř s velkými latami, který vytváří výraznou letní a podzimní dominantu záhonu." data-light="Polostín až slunce" data-height="1,5–2,5 m" data-care="Střední" data-image="/images/flowers/hortenzie-latnata.webp" data-alt="Hortenzie latnatá (Hydrangea paniculata)">
      <span class="ss-plant-card__image"><img loading="lazy" src="/images/flowers/hortenzie-latnata.webp" alt=""></span><span class="ss-plant-card__copy"><b>8. hortenzie latnatá</b><i>Hydrangea paniculata</i></span>
    </button>
    <button class="ss-plant-card" type="button" data-plant aria-expanded="false"
      data-name="Hortenzie stromečkovitá" data-latin="Hydrangea arborescens" data-description="Spolehlivě kvetoucí keř s velkými kulovitými květenstvími pro polostinná a chráněná stanoviště." data-light="Polostín" data-height="1–1,5 m" data-care="Střední" data-image="/images/flowers/hortenzie-stromeckova.webp" data-alt="Hortenzie stromečkovitá (Hydrangea arborescens)">
      <span class="ss-plant-card__image"><img loading="lazy" src="/images/flowers/hortenzie-stromeckova.webp" alt=""></span><span class="ss-plant-card__copy"><b>9. hortenzie stromečkovitá</b><i>Hydrangea arborescens</i></span>
    </button>
    <button class="ss-plant-card" type="button" data-plant aria-expanded="false"
      data-name="Svída krvavá" data-latin="Cornus sanguinea" data-description="Odolný domácí keř s barevnými výhony a plody, vhodný do volných živých plotů a přírodních skupin." data-light="Polostín až slunce" data-height="2–4 m" data-care="Nízká" data-image="/images/flowers/svida-krvava.webp" data-alt="Svída krvavá (Cornus sanguinea)">
      <span class="ss-plant-card__image"><img loading="lazy" src="/images/flowers/svida-krvava.webp" alt=""></span><span class="ss-plant-card__copy"><b>10. svída krvavá</b><i>Cornus sanguinea</i></span>
    </button>
    </div>
  </div>
  <div class="ss-plant-carousel__controls" aria-label="Ovládání sortimentu dřevin">
    <button type="button" data-plant-carousel-prev aria-label="Předchozí dřevina">←</button>
    <button type="button" data-plant-carousel-next aria-label="Další dřevina">→</button>
  </div>
  </div>

  <dialog class="ss-plant-dialog" data-plant-dialog aria-labelledby="plant-dialog-title">
    <button class="ss-plant-dialog__close" type="button" data-plant-close aria-label="Zavřít kartu rostlin">×</button>
    <div class="ss-plant-dialog__stage" data-plant-stage data-direction="next">
    <div class="ss-plant-dialog__media"><img data-field="image" src="/images/flowers/cesmina-ostrolista.webp" alt="Cesmína ostrolistá (Ilex aquifolium)" draggable="false"></div>
    <div class="ss-plant-dialog__content">
      <p class="ss-plant-dialog__label">Karta rostlin</p>
      <h3 id="plant-dialog-title" data-field="name">Cesmína ostrolistá</h3>
      <p class="ss-plant-dialog__latin" data-field="latin">Ilex aquifolium</p>
      <p class="ss-plant-dialog__description" data-field="description">Stálezelená dřevina s lesklými tmavě zelenými listy a výraznými červenými plody.</p>
      <div class="ss-plant-dialog__facts">
        <div class="ss-plant-fact"><img src="/images/pictograms/polostin.svg" alt=""><b>Stanoviště</b><span data-field="light">Polostín až slunce</span></div>
        <div class="ss-plant-fact"><img src="/images/pictograms/vyska-rostliny.svg" alt=""><b>Výška</b><span data-field="height">2–6 m</span></div>
        <div class="ss-plant-fact"><span class="ss-care-meter" data-care-meter data-level="1" aria-hidden="true"><i></i><i></i><i></i></span><b>Náročnost</b><span data-field="care">Nízká</span></div>
      </div>
      <nav class="ss-plant-dialog__nav" aria-label="Procházení rostlin">
        <button type="button" data-plant-prev>← Předchozí</button>
        <button type="button" data-plant-next>Další →</button>
      </nav>
    </div>
    </div>
  </dialog>
</section>

<script defer src="./plant-catalog.js"></script>
